<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>VT 查询 IP/Hash/Domain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .container {
            background: #fff;
            margin-top: 40px;
            padding: 32px 28px 24px 28px;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
            max-width: 820px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 99vh;
            /* 从80vh增加到90vh */
            overflow: auto;
        }

        h2 {
            margin-bottom: 24px;
            color: #f76b1c;
            letter-spacing: 2px;
        }

        .input-group {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #fda085;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border: 1.5px solid #f76b1c;
        }

        button {
            padding: 10px 22px;
            background: linear-gradient(90deg, #fda085 0%, #f76b1c 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(253, 160, 133, 0.15);
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: linear-gradient(90deg, #f76b1c 0%, #fda085 100%);
            transform: translateY(-2px) scale(1.03);
        }

        #result {
            width: 100%;
            margin-top: 18px;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-card {
            background: #f9f9f9;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(253, 160, 133, 0.10);
            padding: 18px 16px;
            width: 100%;
            word-break: break-all;
            font-size: 15px;
            color: #333;
            margin-top: 8px;
            overflow-x: auto;
            max-height: 400px;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px 6px 14px 6px;
                max-width: 98vw;
            }

            .result-card {
                padding: 10px 4px;
            }
        }

        .result-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
            background: #f9f9f9;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(253, 160, 133, 0.10);
            overflow: auto;
            font-size: 15px;
            max-height: 70vh;
            /* 从50vh增加到60vh */
            display: block;
            table-layout: auto;
        }

        .result-table thead,
        .result-table tbody {
            display: table;
            width: 100%;
            table-layout: auto;
        }

        .result-table th,
        .result-table td {
            border: 1px solid #fda085;
            padding: 8px 10px;
            text-align: left;
            word-break: break-all;
            white-space: pre-wrap;
            min-width: 120px;
            max-width: 400px;
            height: auto;
            vertical-align: top;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>VT 查询 IP/Hash/Domain</h2>
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="请输入 IP、域名或文件哈希">
            <button onclick="searchInfo()">查询</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        function getType(input) {
            // 判断是否为IP
            const ipRegex = /^(25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d{2}|[1-9]?\d)){3}$/;
            // 判断是否为域名
            const domainRegex = /^(?!\-)([A-Za-z0-9\-]{1,63}(?<!\-)\.)+[A-Za-z]{2,6}$/;
            // 判断是否为hash（MD5/SHA1/SHA256等）
            const hashRegex = /^[a-fA-F0-9]{32}$|^[a-fA-F0-9]{40}$|^[a-fA-F0-9]{64}$/;

            if (ipRegex.test(input)) return 'ip';
            if (domainRegex.test(input)) return 'domain';
            if (hashRegex.test(input)) return 'hash';
            return null;
        }
        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }
        async function searchInfo() {
            const input = document.getElementById('searchInput').value.trim();
            const type = getType(input);
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            if (!type) {
                resultDiv.innerHTML = '<span style="color:red;">输入内容格式不正确，请输入合法的 IP、域名或文件哈希。</span>';
                return;
            }

            let url = '';
            if (type === 'ip') url = `/ips/${encodeURIComponent(input)}`;
            if (type === 'domain') url = `/domains/${encodeURIComponent(input)}`;
            if (type === 'hash') url = `/files/${encodeURIComponent(input)}`;

            resultDiv.innerHTML = '查询中...';
            let get_url = 'http://172.18.4.200:9000/api/vt' + url
            console.log('===', get_url);

            try {
                const res = await fetch(get_url);
                if (!res.ok) throw new Error('请求失败');
                const data = await res.json();
                // 判断是否为对象，输出为表格，否则原样输出
                if (typeof data === 'object' && data !== null && !Array.isArray(data)) {
                    let table = '<table class="result-table"><thead></thead><tbody>';
                    for (const key in data) {
                        let value = data[key];
                        if (typeof value === 'object') {
                            value = `<pre style="margin:0;">${JSON.stringify(value, null, 2)}</pre>`;
                        }
                        table += `<tr><td>${key}</td><td>${value}</td></tr>`;
                    }
                    table += '</tbody></table>';
                    resultDiv.innerHTML = table;
                } else {
                    resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<span style="color:red;">查询失败：${err.message}</span>`;
            }
        }
    </script>
</body>

</html>
