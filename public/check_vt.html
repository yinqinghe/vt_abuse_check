<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VT 单条查询</title>
  <style>
    :root {
      --bg-top: #f4efe6;
      --bg-bottom: #dbe7f4;
      --card: rgba(255, 255, 255, 0.88);
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --border: rgba(15, 118, 110, 0.16);
      --danger: #b91c1c;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(14, 116, 144, 0.14), transparent 30%),
        linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      padding: 24px;
    }

    .shell { max-width: 980px; margin: 0 auto; }

    .hero {
      padding: 28px 28px 22px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .links a {
      font-size: 14px;
      color: #0e7490;
      text-decoration: none;
      font-weight: 700;
    }

    .panel {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 180px 140px;
      gap: 12px;
    }

    input, select, button {
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      border: 1px solid var(--border);
      font-size: 16px;
    }

    input, select {
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
    }

    input:focus, select:focus {
      outline: 2px solid rgba(15, 118, 110, 0.18);
      border-color: rgba(15, 118, 110, 0.45);
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(15, 118, 110, 0.22);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .result { margin-top: 20px; display: grid; gap: 16px; }

    .card {
      border-radius: 24px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      padding: 22px;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .metric {
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(15, 118, 110, 0.06);
      border: 1px solid rgba(15, 118, 110, 0.08);
    }

    .metric strong {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .metric span {
      font-size: 17px;
      font-weight: 700;
      word-break: break-word;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .error {
      color: var(--danger);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .panel, .grid, .summary { grid-template-columns: 1fr; }
      body { padding: 14px; }
      .hero, .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>VT 单条查询</h1>
      <p class="subtitle">输入 IP、Domain、URL 或文件 Hash，查询核心结果信息。</p>
      <div class="links">
        <a href="/check_vt">VT 单条查询</a>
        <a href="/batch_check_vt">VT 批量查询</a>
        <a href="/check_abuseip">AbuseIPDB 单条查询</a>
        <a href="/batch_check_abuseip">AbuseIPDB 批量查询</a>
        <a href="/check_combined">综合查询</a>
      </div>

      <div class="panel">
        <input id="iocInput" type="text" placeholder="例如: 8.8.8.8 / example.com / d41d8cd98f00b204e9800998ecf8427e">
        <select id="iocType">
          <option value="">自动识别</option>
          <option value="IP">IP</option>
          <option value="Domain">Domain</option>
          <option value="URL">URL</option>
          <option value="Hash">Hash</option>
        </select>
        <button id="searchBtn" type="button">查询</button>
      </div>
    </section>

    <section id="result" class="result"></section>
  </main>

  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <script>
    const input = document.getElementById("iocInput");
    const typeSelect = document.getElementById("iocType");
    const searchBtn = document.getElementById("searchBtn");
    const result = document.getElementById("result");

    function renderMessage(message, isError = false) {
      result.innerHTML = '<article class="card"><div class="' + (isError ? 'error' : '') + '">' + message + '</div></article>';
    }

    function formatUnixTimestamp(value) {
      if (!value) return "N/A";
      return new Date(value * 1000).toLocaleString("zh-CN", { hour12: false });
    }

    function renderResult(data) {
      result.innerHTML = `
        <article class="card">
          <h2>查询结果</h2>
          <div class="summary">
            <div class="metric"><strong>IOC</strong><span>${data.ioc || "N/A"}</span></div>
            <div class="metric"><strong>类型</strong><span>${data.ioc_type || "N/A"}</span></div>
            <div class="metric"><strong>恶意命中数</strong><span>${data.malicious ?? 0}</span></div>
            <div class="metric"><strong>声誉分</strong><span>${data.reputation ?? "N/A"}</span></div>
          </div>
          <div class="grid">
            <div class="metric"><strong>Symantec</strong><span>${data.symantec || "N"}</span></div>
            <div class="metric"><strong>McAfeeD</strong><span>${data.mcafeed || "N"}</span></div>
            <div class="metric"><strong>最近分析时间</strong><span>${formatUnixTimestamp(data.last_analysis_date)}</span></div>
          </div>
          <div class="summary">
            <div class="metric"><strong>VT_Sign</strong><span>${data.vt_sign || "N"}</span></div>
            <div class="metric"><strong>Autonomous System Label</strong><span>${data.autonomous_system_label || ""}</span></div>
          </div>
        </article>
      `;
    }

    async function searchInfo() {
      const ioc = input.value.trim();
      const type = typeSelect.value;

      if (!ioc) {
        renderMessage("请输入要查询的 IOC。", true);
        return;
      }

      searchBtn.disabled = true;
      renderMessage("正在查询 VirusTotal...");

      const params = new URLSearchParams({ ioc });
      if (type) params.set("type", type);

      try {
        const response = await fetch(`/api/check_vt?${params.toString()}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "查询失败");
        }

        renderResult(data);
      } catch (error) {
        renderMessage(error.message || "查询失败", true);
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener("click", searchInfo);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") searchInfo();
    });
  </script>
</body>
</html>
